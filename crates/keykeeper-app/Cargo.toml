[package]
name = "keykeeper-app"
description = "KeyKeeper desktop app (RUNE GUI)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "keykeeper"
path = "src/main.rs"

[dependencies]
rune = { workspace = true }
rune-kit = { workspace = true }
rune-theme-opencode = { workspace = true }
keykeeper-core = { workspace = true }
directories = "6.0.0"
toml = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
jiff = "1.0.3"
uuid = "1.29.3"
zeroize = "1.9.2"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
