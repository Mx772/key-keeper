[package]
name = "keykeeper-app"
description = "KeyKeeper desktop app (RUNE GUI)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "keykeeper"
path = "src/main.rs"

[dependencies]
rune = { workspace = true }
rune-kit = { workspace = true }
rune-theme-opencode = { workspace = true }
keykeeper-core = { workspace = true }
keykeeper-steam = { workspace = true }
directories = "6.0.0"
toml = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
jiff = "1.0.3"
uuid = "1.29.3"
zeroize = "1.9.2"
cargo-packager-updater = "0.2.3"
semver = "1.0.28"

[lints]
workspace = true

[dev-dependencies]
base64 = "0.22.1" # same major as cargo-packager-updater uses
minisign-verify = "0.2.5"
serde_json = "1.0.154"
tempfile = "3.27.0"

[build-dependencies]
embed-resource = "3.0.12"

# Installers: `cargo build --release -p keykeeper-app && cargo packager --release` (see README).
# Windows builds an NSIS setup.exe; macOS builds KeyKeeper.app and a .dmg. Output: target/dist.
[package.metadata.packager]
product-name = "KeyKeeper"
identifier = "io.github.mx772.keykeeper"
publisher = "KeyKeeper"
category = "Utility"
homepage = "https://github.com/Mx772/key-keeper"
license-file = "../../LICENSE"
out-dir = "../../target/dist"
icons = ["assets/icon.icns", "assets/icon-32.png", "assets/icon-128.png", "assets/icon-256.png", "assets/icon-512.png"]

[package.metadata.packager.nsis]
installer-icon = "assets/icon.ico"

[package.metadata.packager.macos]
minimum-system-version = "13.0"
