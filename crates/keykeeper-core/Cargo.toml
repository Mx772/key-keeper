[package]
name = "keykeeper-core"
description = "KeyKeeper domain logic: model, encrypted vault, import/export, trades, templates. No GUI, no network."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
argon2 = "0.6.0"
blake2 = "0.11.0" # already in the tree via argon2
chacha20poly1305 = "0.11.0"
csv = "1.4.0"
getrandom = "0.4.3"
jiff = { version = "1.0.3", features = ["serde"] }
regex = "1.13.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v7", "serde"] }
zeroize = "1.9.2"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
