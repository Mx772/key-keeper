name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version; rustup installs it on first cargo call.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Headless snapshots of every screen (demo data)
        shell: bash
        run: |
          cargo build -p keykeeper-app
          for scene in lock create library detail new-key import import-start cart trades settings shortcuts empty light; do
            cargo run -q -p keykeeper-app -- --snap "target/snap-$scene.png" --scene "$scene" --size 1280x800 || true
          done
        continue-on-error: true # CI runners may lack a GPU; RUNE falls back to WARP on Windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots-${{ matrix.os }}
          path: target/snap-*.png
          if-no-files-found: ignore

  # Line coverage of the GUI-free crates (the app needs RUNE and a GPU, so it is left out).
  # keykeeper-core must stay at or above 80%.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage (core + steam)
        run: cargo llvm-cov -p keykeeper-core -p keykeeper-steam --summary-only
      - name: keykeeper-core line coverage >= 80%
        # Reuses the profile data from the previous step; only core's files count here.
        run: >
          cargo llvm-cov report -p keykeeper-core --summary-only
          --ignore-filename-regex 'keykeeper-steam'
          --fail-under-lines 80

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
