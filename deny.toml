# cargo-deny: run `cargo deny check`. CI fails on any RustSec advisory, unknown license or unknown source.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0", "OFL-1.1",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow" # RUNE pulls in duplicates we cannot control
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/anomalyco/rune"]
