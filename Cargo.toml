[workspace]
resolver = "3"
members = ["crates/keykeeper-core", "crates/keykeeper-steam", "crates/keykeeper-app"]
default-members = ["crates/keykeeper-core", "crates/keykeeper-steam", "crates/keykeeper-app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

# ── RUNE ────────────────────────────────────────────────────────────────────────────────────────
# RUNE is pre-release and git-only. Every RUNE line below MUST use the same rev; bump them together
# (and re-check RUNE's own Cargo.toml [patch.crates-io] list when doing so).
[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "cd7d9a06ed50a8dd7d12f77a89b0ec24e2dab00f", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "cd7d9a06ed50a8dd7d12f77a89b0ec24e2dab00f" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "cd7d9a06ed50a8dd7d12f77a89b0ec24e2dab00f" }

keykeeper-core = { path = "crates/keykeeper-core" }
keykeeper-steam = { path = "crates/keykeeper-steam" }

# Cargo does not inherit a dependency's [patch]; RUNE requires apps to repeat it.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "cd7d9a06ed50a8dd7d12f77a89b0ec24e2dab00f" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "cd7d9a06ed50a8dd7d12f77a89b0ec24e2dab00f" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "cd7d9a06ed50a8dd7d12f77a89b0ec24e2dab00f" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "cd7d9a06ed50a8dd7d12f77a89b0ec24e2dab00f" }
naga = { git = "https://github.com/anomalyco/rune", rev = "cd7d9a06ed50a8dd7d12f77a89b0ec24e2dab00f" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "cd7d9a06ed50a8dd7d12f77a89b0ec24e2dab00f" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "cd7d9a06ed50a8dd7d12f77a89b0ec24e2dab00f" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "cd7d9a06ed50a8dd7d12f77a89b0ec24e2dab00f" }

[workspace.lints.rust]
unsafe_code = "deny" # one audited exception: attach_console in keykeeper-app main.rs
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Argon2 at 256 MiB is ~50x slower unoptimised; keep crypto fast in dev/test builds too.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
